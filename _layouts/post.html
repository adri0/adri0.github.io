---
layout: default
---

{%-include back_link.html-%}

<article>
  <p class="post-meta">
    <time datetime="{{ page.date }}">{{ page.date | date: site.theme_config.date_format }}</time>
  </p>

  <h1>{{ page.title }}</h1>

  {{ content }}

  <footer style="text-align: right; margin-top: 3rem;">
    <p>— {{ site.author }}</p>
  </footer>

  {%-if site.giscus-%}
    {%-include giscus.html-%}
  {%-endif-%}
</article>
